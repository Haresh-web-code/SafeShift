services:
  db:
    image: pgvector/pgvector:pg16
    profiles: ["database"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safeshift}
      POSTGRES_DB: ${POSTGRES_DB:-safeshift}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
